<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipes</title>
  <meta name="description" content="RecipeBook helps you find simple, delicious recipes like a warm apple crisp topped with vanilla ice cream.">
  <meta name="author" content="DJ Knudsen">

  <meta property="og:type" content="website">
  <meta property="og:title" content="RecipeBook">
  <meta property="og:description" content="RecipeBook helps you find simple, delicious recipes like a warm apple crisp topped with vanilla ice cream.">
  <meta property="og:url" content="https://YOUR-USERNAME.github.io/wdd131/recipes/">
  <meta property="og:image" content="social-preview-image.png">

  <meta name="twitter:card" content="Social Preview Image">
  <meta name="twitter:title" content="Recipes">
  <meta name="twitter:description" content="RecipeBook helps you find simple, delicious recipes like a warm apple crisp topped with vanilla ice cream.">
  <meta name="twitter:image" content="social-preview-image.png">

  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="recipes.css">
</head>
<body>
  <header>
    <img src="images/recipe-book.png" alt="recipe book logo" class="logo">
    <h1>RecipeBook</h1>
  </header>

  <main>
    <form class="search">
      <input type="text" placeholder="Find a recipe" aria-label="Find a recipe">
      <button type="submit"><img src="images/search.svg" alt="search"></button>
    </form>

    <hr>

    <section class="recipe">
      <img src="images/apple-crisp.jpg" alt="apple crisp topped with vanilla ice cream" class="recipe-image">
      <div class="recipe-info">
        <span class="tag">dessert</span>
        <h2>Apple Crisp</h2>
        <span
          class="rating"
          role="img"
          aria-label="Rating: 4 out of 5 stars"
        >
          <span aria-hidden="true" class="icon-star">⭐</span>
          <span aria-hidden="true" class="icon-star">⭐</span>
          <span aria-hidden="true" class="icon-star">⭐</span>
          <span aria-hidden="true" class="icon-star">⭐</span>
          <span aria-hidden="true" class="icon-star-empty">☆</span>
        </span>
        <p class="description">This apple crisp recipe is a simple yet delicious fall dessert that's great served warm with vanilla ice cream.</p>
      </div>
    </section>
  </main>

  <footer>
    <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>
    <div class="social">
      <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
      <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
      <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
      <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>
    </div>
  </footer>
</body>
</html>
